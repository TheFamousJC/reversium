<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="sandbox-title sandbox-desc"><title id="sandbox-title">Verify behavior in a disposable local environment</title><desc id="sandbox-desc">Review support first - Analyze package; review alerts and compatibility Then Prepare isolation - Local prerequisites, trusted assets and fresh isolation checks Then Run a bounded test - Fixed reviewed profile: real code, disposable data and accounts Then Record and stop - Capture passes/blockers, stop guest and review matching evidence</desc><rect width="760" height="720" fill="#f5f7ff"/><rect x="25" y="25" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="67" r="22" fill="#4058da"/><text x="65" y="74" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">1</text><text x="105" y="70" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Review support first</text><text x="105" y="104" fill="#465570" font-family="sans-serif" font-size="19">Analyze package; review alerts and compatibility</text><path d="M380 160 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="197" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="239" r="22" fill="#4058da"/><text x="65" y="246" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">2</text><text x="105" y="242" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Prepare isolation</text><text x="105" y="276" fill="#465570" font-family="sans-serif" font-size="19">Local prerequisites, trusted assets and fresh isolation checks</text><path d="M380 332 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="369" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="411" r="22" fill="#4058da"/><text x="65" y="418" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">3</text><text x="105" y="414" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Run a bounded test</text><text x="105" y="448" fill="#465570" font-family="sans-serif" font-size="19">Fixed reviewed profile: real code, disposable data and</text><text x="105" y="473" fill="#465570" font-family="sans-serif" font-size="19">accounts</text><path d="M380 504 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="541" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="583" r="22" fill="#4058da"/><text x="65" y="590" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">4</text><text x="105" y="586" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Record and stop</text><text x="105" y="620" fill="#465570" font-family="sans-serif" font-size="19">Capture passes/blockers, stop guest and review matching</text><text x="105" y="645" fill="#465570" font-family="sans-serif" font-size="19">evidence</text></svg>