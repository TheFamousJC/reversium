<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="ai-handover-title ai-handover-desc"><title id="ai-handover-title">Move a project between AI coding tools</title><desc id="ai-handover-desc">Save the source - Export your authorized code package from the original tool Then Map the delivery - Analyze &gt; Architecture &gt; Evidence Then Prepare the handover - Handover: setup clues, owners, gaps and next checks Then Continue elsewhere - Give the next developer the code, reports and selected context</desc><rect width="760" height="720" fill="#f5f7ff"/><rect x="25" y="25" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="67" r="22" fill="#4058da"/><text x="65" y="74" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">1</text><text x="105" y="70" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Save the source</text><text x="105" y="104" fill="#465570" font-family="sans-serif" font-size="19">Export your authorized code package from the original tool</text><path d="M380 160 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="197" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="239" r="22" fill="#4058da"/><text x="65" y="246" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">2</text><text x="105" y="242" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Map the delivery</text><text x="105" y="276" fill="#465570" font-family="sans-serif" font-size="19">Analyze &gt; Architecture &gt; Evidence</text><path d="M380 332 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="369" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="411" r="22" fill="#4058da"/><text x="65" y="418" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">3</text><text x="105" y="414" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Prepare the handover</text><text x="105" y="448" fill="#465570" font-family="sans-serif" font-size="19">Handover: setup clues, owners, gaps and next checks</text><path d="M380 504 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="541" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="583" r="22" fill="#4058da"/><text x="65" y="590" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">4</text><text x="105" y="586" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Continue elsewhere</text><text x="105" y="620" fill="#465570" font-family="sans-serif" font-size="19">Give the next developer the code, reports and selected context</text></svg>