<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="change-title change-desc"><title id="change-title">Plan a change without guessing</title><desc id="change-desc">Pick the starting file - Analyze &gt; Change impact Then Explore connections - Upstream and downstream candidate neighbors Then Check each claim - Architecture map &gt; Evidence &gt; Coverage Then Make and verify the change - Use your editor and normal tests; save a new baseline</desc><rect width="760" height="720" fill="#f5f7ff"/><rect x="25" y="25" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="67" r="22" fill="#4058da"/><text x="65" y="74" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">1</text><text x="105" y="70" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Pick the starting file</text><text x="105" y="104" fill="#465570" font-family="sans-serif" font-size="19">Analyze &gt; Change impact</text><path d="M380 160 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="197" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="239" r="22" fill="#4058da"/><text x="65" y="246" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">2</text><text x="105" y="242" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Explore connections</text><text x="105" y="276" fill="#465570" font-family="sans-serif" font-size="19">Upstream and downstream candidate neighbors</text><path d="M380 332 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="369" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="411" r="22" fill="#4058da"/><text x="65" y="418" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">3</text><text x="105" y="414" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Check each claim</text><text x="105" y="448" fill="#465570" font-family="sans-serif" font-size="19">Architecture map &gt; Evidence &gt; Coverage</text><path d="M380 504 v22 m-8 -8 l8 8 8 -8" fill="none" stroke="#4058da" stroke-width="3"/><rect x="25" y="541" width="710" height="126" rx="16" fill="white" stroke="#c4cfe6"/><circle cx="65" cy="583" r="22" fill="#4058da"/><text x="65" y="590" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20">4</text><text x="105" y="586" fill="#17253c" font-family="sans-serif" font-size="23" font-weight="bold">Make and verify the change</text><text x="105" y="620" fill="#465570" font-family="sans-serif" font-size="19">Use your editor and normal tests; save a new baseline</text></svg>