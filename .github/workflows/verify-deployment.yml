name: Verify public release
on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
permissions:
  contents: read
jobs:
  public-assets:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_release_docs.py
      - run: python scripts/check_deployment.py --base-url https://thefamousjc.github.io/reversium --attempts 6 --retry-delay 20
